name: API security tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:client
      - run: npm run db:migrate:local

      - name: Install browser tooling
        run: |
          npm install --prefix /tmp/browser-tools playwright@1.63.0
          /tmp/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser to storage checks
        env:
          PLAYWRIGHT_PATH: /tmp/browser-tools/node_modules/playwright
        run: |
          node api/tests/local-server.js > /tmp/auth-browser.log 2>&1 &
          python3 -m http.server 5173 --bind 127.0.0.1 --directory client/dist > /tmp/auth-client.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://localhost:8787/health > /dev/null && break; sleep 1; done
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-evidence
          path: tests/screenshots
